# Deploys the PWA in pwa/ to GitHub Pages.
# The model and the ONNX runtime are not in git; they are fetched here with checksum verification.
# The index (pwa/data/) is committed, because it can only be built locally from the card images.
name: Deploy PWA

on:
  push:
    branches: [main]
    paths:
      - "pwa/**"
      - "tools/model/**"
      - "tools/vendor/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Fetch ONNX runtime (npm tarball, integrity-checked)
        run: python tools/vendor/fetch_ort.py

      - name: Prepare model (ONNX model zoo, SHA-256-checked)
        run: |
          python -m pip install --disable-pip-version-check -r tools/model/requirements.txt
          python tools/model/prepare_model.py

      - name: Check index
        run: test -f pwa/data/index.json && test -f pwa/data/embeddings.bin && test -f pwa/data/variants.json

      - name: Assemble site
        run: |
          mkdir _site
          cp -r pwa/. _site/
          rm -rf _site/dev _site/README.md
          touch _site/.nojekyll
          # A new service worker version replaces the cached app shell on the phones.
          sed -i "s/^const VERSION = \"dev\";/const VERSION = \"${GITHUB_SHA::12}\";/" _site/sw.js
          grep -q "^const VERSION = \"${GITHUB_SHA::12}\";" _site/sw.js
          du -sh _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
